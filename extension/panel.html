<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>projbench</title>
<link rel="stylesheet" href="panel.css" />
</head>
<body>
  <header>
    <h1>projbench</h1>
    <nav class="tabs">
      <button class="tab on" data-tab="history">History</button>
      <button class="tab" data-tab="map">Map</button>
    </nav>
  </header>

  <!-- history ------------------------------------------------------------ -->
  <section class="view on" data-view="history">
    <div class="bar">
      <input id="repo" value="agoston0x/projbench" spellcheck="false" />
      <button id="load" title="Load this repository">Load</button>
    </div>
    <div class="bar">
      <button data-zoom="out" title="Zoom out">−</button>
      <span id="zoomLevel">100%</span>
      <button data-zoom="in" title="Zoom in">+</button>
      <button data-zoom="fit" title="Reset">Fit</button>
      <span class="grow"></span>
      <button id="expandAll">Expand all</button>
      <button id="collapseAll">Collapse all</button>
    </div>
    <div id="stage">
      <div id="canvas">
        <svg id="lines"></svg>
        <div id="nodes"></div>
      </div>
    </div>
  </section>

  <!-- map ---------------------------------------------------------------- -->
  <section class="view" data-view="map">
    <div class="bar">
      <span id="mapCount" class="count"></span>
    </div>
    <div id="mapStage"></div>
  </section>

  <footer id="status">idle</footer>

  <script src="store.js"></script>
  <script src="github.js"></script>
  <script src="tree.js"></script>
  <script src="map.js"></script>
  <script src="mapview.js"></script>
  <script src="panel.js"></script>
</body>
</html>
